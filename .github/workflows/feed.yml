name: Feed

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_call:
    inputs:
      slot:
        description: "Which slot to run (auto = decide by JST hour)"
        required: false
        type: string
        default: "auto"
  workflow_dispatch:
    inputs:
      slot:
        description: "Which slot to run (auto = decide by JST hour)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - spot
          - garbage
          - cheatsheet
          - restaurant
          - event
          - spot_intro
          - activity

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      slot: ${{ steps.sel.outputs.slot }}
    steps:
      - name: Select slot (JST)
        id: sel
        shell: bash
        run: |
          set -euo pipefail

          SLOT="${{ inputs.slot }}"
          if [ -z "$SLOT" ]; then
            SLOT="auto"
          fi

          if [ "$SLOT" != "auto" ]; then
            echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
            echo "manual slot=$SLOT"
            exit 0
          fi

          HOUR="$(TZ=Asia/Tokyo date +%H)"
          HOUR="${HOUR#0}"
          DOW="$(TZ=Asia/Tokyo date +%u)"  # 1=Mon ... 7=Sun

          if (( HOUR >= 0 && HOUR < 2 )); then
            SLOT="spot"
          elif (( HOUR >= 2 && HOUR < 5 )); then
            SLOT="cheetsheet"
          elif (( HOUR >= 5 && HOUR < 7 )); then
            if (( DOW >= 1 && DOW <= 5 )); then
              SLOT="garbage"
            else
              SLOT="spot"
            fi
          elif (( HOUR >= 7 && HOUR < 13 )); then
            SLOT="restaurant"
          elif (( HOUR >= 13 && HOUR < 17 )); then
            SLOT="event"
          elif (( HOUR >= 17 && HOUR < 20 )); then
            SLOT="activity"
          elif (( HOUR >= 20 && HOUR < 22 )); then
            if (( (DOW >= 1 && DOW <= 4) || DOW == 7 )); then
              SLOT="garbage"
            else
              SLOT="spot"
            fi
          elif (( HOUR >= 22 && HOUR < 24 )); then
            SLOT="spot_intro"
          else
            echo "ERROR: unexpected hour: $HOUR"
            exit 1
          fi

          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
          echo "JST hour=$HOUR dow=$DOW -> slot=$SLOT"

  sspot:
    needs: select
    if: needs.select.outputs.slot == 'spot'
    uses: ./.github/workflows/feed_slot_spot.yml
    secrets: inherit

  sgarbage:
    needs: select
    if: needs.select.outputs.slot == 'garbage'
    uses: ./.github/workflows/feed_slot_garbage.yml
    secrets: inherit

  scheatsheet:
    needs: select
    if: needs.select.outputs.slot == 'cheatsheet'
    uses: ./.github/workflows/cheatsheet.yml
    secrets: inherit

  srestaurant:
    needs: select
    if: needs.select.outputs.slot == 'restaurant'
    uses: ./.github/workflows/feed_slot_restaurant.yml
    secrets: inherit

  sevent:
    needs: select
    if: needs.select.outputs.slot == 'event'
    uses: ./.github/workflows/feed_slot_event.yml
    secrets: inherit

  sspot_intro:
    needs: select
    if: needs.select.outputs.slot == 'spot_intro'
    uses: ./.github/workflows/google_drive_post.yml
    with:
      kind: "event"
      avatar_image: "image/avatar/event.png"
      place: "Yokosuka"
      post_to_x: "1"
    secrets: inherit

  sactivity:
    needs: select
    if: needs.select.outputs.slot == 'activity'
    uses: ./.github/workflows/feed_slot_activity.yml
    secrets: inherit
