name: Feed

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_call:
    inputs:
      slot:
        description: "Which slot to run (auto = decide by JST hour)"
        required: false
        type: string
        default: "auto"
  workflow_dispatch:
    inputs:
      slot:
        description: "Which slot to run (auto = decide by JST hour)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - spot
          - 05_07_garbage_today_day
          - restaurant
          - 10_13_restaurant_food
          - event
          - activity
          - 20_22_garbage_tomorrow_night
          - 22_24_spot_night

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      slot: ${{ steps.sel.outputs.slot }}
    steps:
      - name: Select slot (JST)
        id: sel
        shell: bash
        run: |
          set -euo pipefail

          SLOT="${{ inputs.slot }}"
          if [ -z "$SLOT" ]; then
            SLOT="auto"
          fi

          if [ "$SLOT" != "auto" ]; then
            echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
            echo "manual slot=$SLOT"
            exit 0
          fi

          HOUR="$(TZ=Asia/Tokyo date +%H)"
          HOUR="${HOUR#0}"
          DOW="$(TZ=Asia/Tokyo date +%u)"  # 1=Mon ... 7=Sun

          if (( HOUR >= 0 && HOUR < 5 )); then
            SLOT="spot"
          elif (( HOUR >= 5 && HOUR < 7 )); then
            if (( DOW >= 1 && DOW <= 5 )); then
              SLOT="05_07_garbage_today_day"
            else
              SLOT="skip"
            fi
          elif (( HOUR >= 7 && HOUR < 10 )); then
            SLOT="restaurant"
          elif (( HOUR >= 10 && HOUR < 13 )); then
            SLOT="10_13_restaurant_food"
          elif (( HOUR >= 13 && HOUR < 17 )); then
            SLOT="event"
          elif (( HOUR >= 17 && HOUR < 20 )); then
            SLOT="activity"
          elif (( HOUR >= 20 && HOUR < 22 )); then
            if (( (DOW >= 1 && DOW <= 5) || DOW == 7 )); then
              SLOT="20_22_garbage_tomorrow_night"
            else
              SLOT="skip"
            fi
          elif (( HOUR >= 22 && HOUR < 24 )); then
            SLOT="22_24_spot_night"
          else
            echo "ERROR: unexpected hour: $HOUR"
            exit 1
          fi

          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
          echo "JST hour=$HOUR dow=$DOW -> slot=$SLOT"

  sspot:
    needs: select
    if: needs.select.outputs.slot == 'spot'
    uses: ./.github/workflows/feed_slot_spot.yml
    secrets: inherit

  s05_07_garbage_today_day:
    needs: select
    if: needs.select.outputs.slot == '05_07_garbage_today_day'
    uses: ./.github/workflows/feed_slot_05_07_garbage_today_day.yml
    secrets: inherit

  srestaurant:
    needs: select
    if: needs.select.outputs.slot == 'restaurant'
    uses: ./.github/workflows/feed_slot_restaurant.yml
    secrets: inherit

  s10_13_restaurant_food:
    needs: select
    if: needs.select.outputs.slot == '10_13_restaurant_food'
    uses: ./.github/workflows/feed_slot_10_13_restaurant_food.yml
    secrets: inherit

  sevent:
    needs: select
    if: needs.select.outputs.slot == 'event'
    uses: ./.github/workflows/feed_slot_event.yml
    secrets: inherit

  sactivity:
    needs: select
    if: needs.select.outputs.slot == 'activity'
    uses: ./.github/workflows/feed_slot_activity.yml
    secrets: inherit

  s20_22_garbage_tomorrow_night:
    needs: select
    if: needs.select.outputs.slot == '20_22_garbage_tomorrow_night'
    uses: ./.github/workflows/feed_slot_garbageyml
    secrets: inherit

  s22_24_spot_night:
    needs: select
    if: needs.select.outputs.slot == '22_24_spot_night'
    uses: ./.github/workflows/feed_slot_22_24_spot_night.yml
    secrets: inherit