name: Feed

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_call:
    inputs:
      slot:
        description: "Which slot to run (auto = decide by JST hour)"
        required: false
        type: string
        default: "auto"
  workflow_dispatch:
    inputs:
      slot:
        description: "Which slot to run (auto = decide by JST hour)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - 00_05_spot_night
          - 05_07_garbage_today_day
          - 07_10_restaurant_normal
          - 10_13_restaurant_food
          - 13_17_event
          - 17_20_activity
          - 20_22_garbage_tomorrow_night
          - 22_24_spot_night

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      slot: ${{ steps.sel.outputs.slot }}
    steps:
      - name: Select slot (JST)
        id: sel
        shell: bash
        run: |
          set -euo pipefail

          SLOT="${{ inputs.slot }}"
          if [ -z "$SLOT" ]; then
            SLOT="auto"
          fi

          if [ "$SLOT" != "auto" ]; then
            echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
            echo "manual slot=$SLOT"
            exit 0
          fi

          HOUR="$(TZ=Asia/Tokyo date +%H)"
          HOUR="${HOUR#0}"

          if (( HOUR >= 0 && HOUR < 5 )); then
            SLOT="00_05_spot_night"
          elif (( HOUR >= 5 && HOUR < 7 )); then
            SLOT="05_07_garbage_today_day"
          elif (( HOUR >= 7 && HOUR < 10 )); then
            SLOT="07_10_restaurant_normal"
          elif (( HOUR >= 10 && HOUR < 13 )); then
            SLOT="10_13_restaurant_food"
          elif (( HOUR >= 13 && HOUR < 17 )); then
            SLOT="13_17_event"
          elif (( HOUR >= 17 && HOUR < 20 )); then
            SLOT="17_20_activity"
          elif (( HOUR >= 20 && HOUR < 22 )); then
            SLOT="20_22_garbage_tomorrow_night"
          elif (( HOUR >= 22 && HOUR < 24 )); then
            SLOT="22_24_spot_night"
          else
            echo "ERROR: unexpected hour: $HOUR"
            exit 1
          fi

          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
          echo "JST hour=$HOUR -> slot=$SLOT"

  s00_05_spot_night:
    needs: select
    if: needs.select.outputs.slot == '00_05_spot_night'
    uses: ./.github/workflows/feed_slot_00_05_spot_night.yml
    secrets: inherit

  s05_07_garbage_today_day:
    needs: select
    if: needs.select.outputs.slot == '05_07_garbage_today_day'
    uses: ./.github/workflows/feed_slot_05_07_garbage_today_day.yml
    secrets: inherit

  s07_10_restaurant_normal:
    needs: select
    if: needs.select.outputs.slot == '07_10_restaurant_normal'
    uses: ./.github/workflows/feed_slot_07_10_restaurant_normal.yml
    secrets: inherit

  s10_13_restaurant_food:
    needs: select
    if: needs.select.outputs.slot == '10_13_restaurant_food'
    uses: ./.github/workflows/feed_slot_10_13_restaurant_food.yml
    secrets: inherit

  s13_17_event:
    needs: select
    if: needs.select.outputs.slot == '13_17_event'
    uses: ./.github/workflows/feed_slot_13_17_event.yml
    secrets: inherit

  s17_20_activity:
    needs: select
    if: needs.select.outputs.slot == '17_20_activity'
    uses: ./.github/workflows/feed_slot_17_20_activity.yml
    secrets: inherit

  s20_22_garbage_tomorrow_night:
    needs: select
    if: needs.select.outputs.slot == '20_22_garbage_tomorrow_night'
    uses: ./.github/workflows/feed_slot_20_22_garbage_tomorrow_night.yml
    secrets: inherit

  s22_24_spot_night:
    needs: select
    if: needs.select.outputs.slot == '22_24_spot_night'
    uses: ./.github/workflows/feed_slot_22_24_spot_night.yml
    secrets: inherit

