name: Article Drive Random

on:
  schedule:
    # 08:15 JST
    - cron: '15 23 * * *'
  workflow_dispatch:
    inputs:
      root_folder_url_override:
        description: "Optional override for the public Google Drive root folder URL"
        required: false
        default: ""
        type: string
      place:
        description: "Place label for the teaser feed"
        required: false
        default: "Yokosuka"
        type: string
      avatar_image:
        description: "Avatar image path under public/"
        required: false
        default: "image/avatar/spot.png"
        type: string
      recent_exclude_limit:
        description: "Avoid article folders used in the last N feed files when possible"
        required: false
        default: "20"
        type: string
      random_seed:
        description: "Optional deterministic seed for testing"
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

env:
  ASSET_MODE: local
  ARTIFACT_PUBLIC_DIR: frontend/app/public
  ARTIFACT_FEED_DIR: ""
  ARTIFACT_IMAGE_DIR: ""
  ARTIFACT_SNAPSHOT_DIR: ""
  ARTIFACT_LATEST_PATH: frontend/app/public/latest.json
  PUBLIC_FEED_URL: ./latest.json
  PUBLIC_ASSET_BASE_URL: ""
  PUBLIC_FEED_BASE_URL: ""
  PUBLIC_IMAGE_BASE_URL: ""
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_S3_BUCKET_PUBLIC: ${{ vars.AWS_S3_BUCKET_PUBLIC }}
  AWS_CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }}

concurrency:
  group: article-drive-random
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.publish.outputs.changed }}
    steps:
      - name: Checkout (main)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull latest main
        run: |
          set -euo pipefail
          git pull --ff-only origin main

      - name: Build random article page + teaser feed from Drive subfolder
        env:
          ROOT_FOLDER_URL_DEFAULT: ${{ vars.GOOGLE_DRIVE_PUBLIC_ARTICLES_ROOT_FOLDER_URL }}
          INPUT_ROOT_FOLDER_URL_OVERRIDE: ${{ inputs.root_folder_url_override }}
          INPUT_PLACE: ${{ inputs.place }}
          INPUT_AVATAR_IMAGE: ${{ inputs.avatar_image }}
          INPUT_RECENT_EXCLUDE_LIMIT: ${{ inputs.recent_exclude_limit }}
          INPUT_RANDOM_SEED: ${{ inputs.random_seed }}
        run: |
          set -euo pipefail
          ROOT_FOLDER_URL="$ROOT_FOLDER_URL_DEFAULT"
          if [ -n "$INPUT_ROOT_FOLDER_URL_OVERRIDE" ]; then
            ROOT_FOLDER_URL="$INPUT_ROOT_FOLDER_URL_OVERRIDE"
          fi
          if [ -z "$ROOT_FOLDER_URL" ]; then
            echo "ERROR: GOOGLE_DRIVE_PUBLIC_ARTICLES_ROOT_FOLDER_URL is empty and no root_folder_url_override was provided." >&2
            exit 1
          fi

          python scripts/prepare_drive_article_teaser.py \
            --root-folder-url "$ROOT_FOLDER_URL" \
            --place "$INPUT_PLACE" \
            --avatar-image "$INPUT_AVATAR_IMAGE" \
            --recent-exclude-limit "$INPUT_RECENT_EXCLUDE_LIMIT" \
            --random-seed "$INPUT_RANDOM_SEED" \
            --public-dir "${ARTIFACT_PUBLIC_DIR:-frontend/app/public}" \
            --latest-path "${ARTIFACT_LATEST_PATH:-frontend/app/public/latest.json}"

      - name: Package generated state for pages deploy
        id: publish
        run: |
          set -euo pipefail
          PUBLIC_DIR="${ARTIFACT_PUBLIC_DIR:-frontend/app/public}"
          STAGE_DIR=/tmp/pages-state
          rm -rf "$STAGE_DIR"
          mkdir -p "$STAGE_DIR"
          cp -a "$PUBLIC_DIR"/. "$STAGE_DIR"/
          tar -C "$STAGE_DIR" -czf /tmp/pages-state.tgz .
          echo "changed=1" >> "$GITHUB_OUTPUT"

      - name: Upload generated state artifact
        if: steps.publish.outputs.changed == '1'
        uses: actions/upload-artifact@v4
        with:
          name: pages-state-${{ github.run_id }}
          path: /tmp/pages-state.tgz
          if-no-files-found: error
          retention-days: 1

  pages:
    needs: prepare
    if: needs.prepare.outputs.changed == '1'
    uses: ./.github/workflows/pages.yml
