name: Pages Redirect

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pages_redirect.yml

permissions:
  contents: read

concurrency:
  group: pages-redirect
  cancel-in-progress: true

env:
  REDIRECT_TARGET: ${{ vars.REDIRECT_TARGET }}
  CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
  PATH_PREFIX_TO_STRIP: ${{ vars.PATH_PREFIX_TO_STRIP }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build notice-only landing site
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${REDIRECT_TARGET}" ]; then
            echo "Repository variable REDIRECT_TARGET is empty." >&2
            exit 1
          fi

          SITE_DIR="_site"
          TARGET="${REDIRECT_TARGET%/}"
          STRIP_PREFIX="${PATH_PREFIX_TO_STRIP%/}"

          rm -rf "$SITE_DIR"
          mkdir -p "$SITE_DIR"

          cat > "$SITE_DIR/index.html" <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>Site moved</title>
              <meta name="robots" content="noindex" />
              <style>
                :root {
                  color-scheme: light dark;
                }
                body {
                  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                  line-height: 1.6;
                  margin: 0;
                  padding: 2rem;
                }
                main {
                  max-width: 48rem;
                  margin: 0 auto;
                }
                .card {
                  border: 1px solid rgba(127, 127, 127, 0.35);
                  border-radius: 12px;
                  padding: 1.25rem;
                }
                code {
                  word-break: break-all;
                }
                a.button {
                  display: inline-block;
                  margin-top: 1rem;
                  padding: 0.75rem 1rem;
                  border: 1px solid currentColor;
                  border-radius: 999px;
                  text-decoration: none;
                }
              </style>
            </head>
            <body>
              <main>
                <div class="card">
                  <h1>This site has moved</h1>
                  <p>
                    The GitHub Pages site is no longer the primary public site.
                    Please use the AWS-hosted site below.
                  </p>
                  <p>
                    Destination:
                    <br />
                    <code id="target-text">__TARGET__/</code>
                  </p>
                  <p>
                    <a id="target-link" class="button" href="__TARGET__/">Open the new site</a>
                  </p>
                  <noscript>
                    <p>
                      JavaScript is disabled, so the destination link points to the site root.
                    </p>
                  </noscript>
                </div>
              </main>
              <script>
                (function () {
                  var base = "__TARGET__";
                  var stripPrefix = "__STRIP_PREFIX__";
                  var path = window.location.pathname || "/";
                  var query = window.location.search || "";
                  var hash = window.location.hash || "";

                  if (stripPrefix && path === stripPrefix) {
                    path = "/";
                  } else if (stripPrefix && path.indexOf(stripPrefix + "/") === 0) {
                    path = path.slice(stripPrefix.length);
                  }

                  if (path !== "/") {
                    path = path.replace(/\/+$/, "");
                  }

                  var next = base + (path === "/" ? "" : path) + query + hash;
                  var link = document.getElementById("target-link");
                  var text = document.getElementById("target-text");
                  if (link) {
                    link.href = next;
                  }
                  if (text) {
                    text.textContent = next;
                  }
                })();
              </script>
            </body>
          </html>
          HTML

          sed -i "s|__TARGET__|${TARGET}|g" "$SITE_DIR/index.html"
          sed -i "s|__STRIP_PREFIX__|${STRIP_PREFIX}|g" "$SITE_DIR/index.html"

          cp "$SITE_DIR/index.html" "$SITE_DIR/404.html"
          touch "$SITE_DIR/.nojekyll"

          if [ -n "${CUSTOM_DOMAIN}" ]; then
            printf '%s\n' "${CUSTOM_DOMAIN}" > "$SITE_DIR/CNAME"
          fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4