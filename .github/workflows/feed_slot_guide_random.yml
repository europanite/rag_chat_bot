name: Feed Guide Random

on:
  workflow_dispatch:
    inputs:
      avatar_image:
        description: "Avatar image path under public/ (e.g. image/avatar/spot.png)"
        required: false
        default: "image/avatar/spot.png"
        type: string
      place:
        description: "Place label"
        required: false
        default: "Yokosuka"
        type: string
      recent_exclude_limit:
        description: "Avoid guides used in the last N feed files when possible"
        required: false
        default: "20"
        type: string
      random_seed:
        description: "Optional deterministic seed for testing"
        required: false
        default: ""
        type: string
      post_to_x:
        description: "1 to post to X after publish"
        required: false
        default: "1"
        type: choice
        options:
          - "0"
          - "1"
  workflow_call:
    inputs:
      avatar_image:
        required: false
        default: "image/avatar/spot.png"
        type: string
      place:
        required: false
        default: "Yokosuka"
        type: string
      recent_exclude_limit:
        required: false
        default: "20"
        type: string
      random_seed:
        required: false
        default: ""
        type: string
      post_to_x:
        required: false
        default: "1"
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

env:
  ASSET_MODE: local
  ARTIFACT_PUBLIC_DIR: frontend/app/public
  ARTIFACT_FEED_DIR: ""
  ARTIFACT_IMAGE_DIR: ""
  ARTIFACT_SNAPSHOT_DIR: ""
  ARTIFACT_LATEST_PATH: frontend/app/public/latest.json
  PUBLIC_FEED_URL: ./latest.json
  PUBLIC_ASSET_BASE_URL: ""
  PUBLIC_FEED_BASE_URL: ""
  PUBLIC_IMAGE_BASE_URL: ""
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_S3_BUCKET_PUBLIC: ${{ vars.AWS_S3_BUCKET_PUBLIC }}
  AWS_CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }}

concurrency:
  group: feed-guide-random
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.publish.outputs.changed }}
      feed_stem: ${{ steps.meta.outputs.feed_stem }}
    steps:
      - name: Checkout (main)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull latest main
        run: |
          set -euo pipefail
          git pull --ff-only origin main

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Restore guide index + recent feed state from S3
        run: |
          set -euo pipefail
          PUBLIC_DIR="${ARTIFACT_PUBLIC_DIR:-frontend/app/public}"
          BUCKET="s3://${AWS_S3_BUCKET_PUBLIC}"

          mkdir -p "$PUBLIC_DIR/articles" "$PUBLIC_DIR/feed" "$PUBLIC_DIR/image"

          aws s3 cp "$BUCKET/articles/index.json" "$PUBLIC_DIR/articles/index.json"
          aws s3 sync "$BUCKET/feed/" "$PUBLIC_DIR/feed/" --exclude ".gitkeep" --exclude ".nojekyll" 2>/dev/null || true

      - name: Build random guide teaser feed from existing S3 guide index
        env:
          INPUT_AVATAR_IMAGE: ${{ inputs.avatar_image }}
          INPUT_PLACE: ${{ inputs.place }}
          INPUT_RECENT_EXCLUDE_LIMIT: ${{ inputs.recent_exclude_limit }}
          INPUT_RANDOM_SEED: ${{ inputs.random_seed }}
        run: |
          set -euo pipefail
          python scripts/prepare_s3_guide_teaser.py             --articles-index "${ARTIFACT_PUBLIC_DIR:-frontend/app/public}/articles/index.json"             --place "$INPUT_PLACE"             --avatar-image "$INPUT_AVATAR_IMAGE"             --recent-exclude-limit "$INPUT_RECENT_EXCLUDE_LIMIT"             --random-seed "$INPUT_RANDOM_SEED"             --public-dir "${ARTIFACT_PUBLIC_DIR:-frontend/app/public}"             --latest-path "${ARTIFACT_LATEST_PATH:-frontend/app/public/latest.json}"             --output-state /tmp/s3_guide_teaser_state.json

      - name: Export prepare metadata
        id: meta
        run: |
          set -euo pipefail
          python - <<'PY2'
          import json
          import os
          from pathlib import Path

          state = json.loads(Path('/tmp/s3_guide_teaser_state.json').read_text(encoding='utf-8'))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f"feed_stem={state['feed_stem']}\n")
              f.write(f"image_rel={state.get('image_rel', '')}\n")
          PY2

      - name: Restore selected guide hero image from S3 (if any)
        env:
          IMAGE_REL: ${{ steps.meta.outputs.image_rel }}
        run: |
          set -euo pipefail
          if [ -z "${IMAGE_REL:-}" ]; then
            exit 0
          fi

          REL="$IMAGE_REL"
          REL="${REL#./}"
          DEST="${ARTIFACT_PUBLIC_DIR:-frontend/app/public}/$REL"
          mkdir -p "$(dirname "$DEST")"
          aws s3 cp "s3://${AWS_S3_BUCKET_PUBLIC}/$REL" "$DEST"

      - name: Package generated state for pages deploy
        id: publish
        run: |
          set -euo pipefail

          PUBLIC_DIR="${ARTIFACT_PUBLIC_DIR:-frontend/app/public}"
          LATEST_PATH_RESOLVED="${ARTIFACT_LATEST_PATH:-$PUBLIC_DIR/latest.json}"
          FEED_DIR_RESOLVED="${ARTIFACT_FEED_DIR:-$PUBLIC_DIR/feed}"
          FEED_STEM="${{ steps.meta.outputs.feed_stem }}"
          IMAGE_REL="${{ steps.meta.outputs.image_rel }}"
          FEED_JSON_PATH="$FEED_DIR_RESOLVED/$FEED_STEM.json"

          test -f "$LATEST_PATH_RESOLVED"
          test -f "$FEED_JSON_PATH"

          STAGE_DIR=/tmp/pages-state
          rm -rf "$STAGE_DIR"
          mkdir -p "$STAGE_DIR/feed" "$STAGE_DIR/image"
          cp "$LATEST_PATH_RESOLVED" "$STAGE_DIR/latest.json"
          cp "$FEED_JSON_PATH" "$STAGE_DIR/feed/$FEED_STEM.json"

          if [ -n "$IMAGE_REL" ]; then
            IMAGE_REL_CLEAN="${IMAGE_REL#./}"
            SRC="$PUBLIC_DIR/$IMAGE_REL_CLEAN"
            if [ -f "$SRC" ]; then
              mkdir -p "$STAGE_DIR/$(dirname "$IMAGE_REL_CLEAN")"
              cp "$SRC" "$STAGE_DIR/$IMAGE_REL_CLEAN"
            fi
          fi

          tar -C "$STAGE_DIR" -czf /tmp/pages-state.tgz .
          echo "changed=1" >> "$GITHUB_OUTPUT"

      - name: Upload generated state artifact
        if: steps.publish.outputs.changed == '1'
        uses: actions/upload-artifact@v4
        with:
          name: pages-state-${{ github.run_id }}
          path: /tmp/pages-state.tgz
          if-no-files-found: error
          retention-days: 1

      - name: Upload latest.json for x_post
        if: steps.publish.outputs.changed == '1'
        uses: actions/upload-artifact@v4
        with:
          name: latest-json-${{ github.run_id }}
          path: ${{ env.ARTIFACT_LATEST_PATH }}
          if-no-files-found: error
          retention-days: 1

  pages:
    needs: prepare
    if: needs.prepare.outputs.changed == '1'
    uses: ./.github/workflows/pages.yml
    secrets: inherit
    with:
      ref: main
      state_artifact_name: pages-state-${{ github.run_id }}
      artifact_run_id: ${{ github.run_id }}
    permissions:
      actions: read
      contents: read
      id-token: write

  x_post:
    needs: [prepare, pages]
    if: needs.prepare.outputs.changed == '1' && inputs.post_to_x == '1'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: post-x
      cancel-in-progress: false
    steps:
      - name: Checkout (main)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download generated state artifact
        uses: actions/download-artifact@v4
        with:
          name: pages-state-${{ github.run_id }}
          path: /tmp/pages-state

      - name: Restore generated state into public dir
        run: |
          set -euo pipefail
          mkdir -p frontend/app/public
          tar -C frontend/app/public -xzf /tmp/pages-state/pages-state.tgz

      - name: Download latest.json artifact
        uses: actions/download-artifact@v4
        with:
          name: latest-json-${{ github.run_id }}
          path: /tmp/latest-json

      - name: Place latest.json where post_to_x.py expects it
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "${ARTIFACT_LATEST_PATH}")"
          cp /tmp/latest-json/latest.json "${ARTIFACT_LATEST_PATH}"

      - name: Cache posted marker (per feed stem)
        id: cache
        uses: actions/cache@v4
        with:
          path: .x-posted
          key: x-posted-${{ needs.prepare.outputs.feed_stem }}

      - name: Post latest to X
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          LATEST_PATH: ${{ env.ARTIFACT_LATEST_PATH }}
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
        run: |
          set -euo pipefail
          python scripts/post_to_x.py
          mkdir -p .x-posted
          echo '${{ needs.prepare.outputs.feed_stem }}' > .x-posted/feed_stem

      - name: Skip (already posted)
        if: steps.cache.outputs.cache-hit == 'true'
        run: echo "Already posted for this feed stem."
