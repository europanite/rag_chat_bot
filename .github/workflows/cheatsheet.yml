name: Cheat Sheet

on:
  workflow_call:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  id-token: write

env:
  ASSET_MODE: local
  ARTIFACT_PUBLIC_DIR: frontend/app/public
  ARTIFACT_FEED_DIR: ""
  ARTIFACT_IMAGE_DIR: ""
  ARTIFACT_SNAPSHOT_DIR: ""
  ARTIFACT_LATEST_PATH: frontend/app/public/latest.json
  PUBLIC_FEED_URL: ./latest.json
  PUBLIC_ASSET_BASE_URL: ""
  PUBLIC_FEED_BASE_URL: ""
  PUBLIC_IMAGE_BASE_URL: ""

concurrency:
  group: yokosuka-morning-cheatsheet
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      entry_json: ${{ steps.payload.outputs.entry_json }}
    steps:
      - name: Checkout (main)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Load fixed payload
        id: payload
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path('.github/fixed/cheatsheet.json').read_text(encoding='utf-8'))
          compact = json.dumps(payload, ensure_ascii=False)

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f"entry_json={compact}\n")
          PY

  fixed:
    needs: prepare
    uses: ./.github/workflows/fixed_entry.yml
    permissions:
      actions: read
      contents: read
      id-token: write
    with:
      entry_json: ${{ needs.prepare.outputs.entry_json }}
      place: "Yokosuka"
    secrets: inherit

  illustrate:
    needs: fixed
    if: needs.fixed.outputs.changed == '1'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.publish.outputs.changed }}
      feed_stem: ${{ steps.publish.outputs.feed_stem }}
    steps:
      - name: Checkout (generated commit)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.fixed.outputs.sha }}
          fetch-depth: 0

      - name: Download fixed state artifact
        uses: actions/download-artifact@v4
        with:
          name: fixed-entry-state-${{ github.run_id }}
          path: /tmp/fixed-entry-state

      - name: Restore fixed state into public dir
        run: |
          set -euo pipefail
          mkdir -p "${ARTIFACT_PUBLIC_DIR}"
          tar -C "${ARTIFACT_PUBLIC_DIR}" -xzf /tmp/fixed-entry-state/fixed-entry-state.tgz
          test -f "${ARTIFACT_LATEST_PATH}"
          find "${ARTIFACT_PUBLIC_DIR}/feed" -maxdepth 1 -type f -name 'feed_*.json' | sort | tail -n 5
          cat "${ARTIFACT_LATEST_PATH}"

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Build illustrate image
        env:
          REACT_NATIVE_PACKAGER_HOSTNAME: '127.0.0.1'
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml build illustrate

      - name: Generate fixed image and patch feed
        env:
          REACT_NATIVE_PACKAGER_HOSTNAME: '127.0.0.1'
          PATCH_JSON: '1'
          OUT_DIR: '${{ env.ARTIFACT_IMAGE_DIR }}'
          FEED_PATH: '${{ env.ARTIFACT_PUBLIC_DIR }}'
          LATEST_PATH: '${{ env.ARTIFACT_LATEST_PATH }}'
          PLACE: 'Yokosuka, Japan'
          MIRROR_AUG: '0'
          SEED_OFFSET: '0'
          SDXL_MODEL_ID: stabilityai/sdxl-turbo
        run: |
          set -euo pipefail
          test -f "${ARTIFACT_LATEST_PATH:-frontend/app/public/latest.json}"
          docker compose -f docker-compose.yml run --rm illustrate

      - name: Package generated state for pages deploy
        id: publish
        run: |
          set -euo pipefail

          PUBLIC_DIR="${ARTIFACT_PUBLIC_DIR:-frontend/app/public}"
          LATEST_PATH_RESOLVED="${ARTIFACT_LATEST_PATH:-$PUBLIC_DIR/latest.json}"
          FEED_DIR_RESOLVED="${ARTIFACT_FEED_DIR:-$PUBLIC_DIR/feed}"
          IMAGE_DIR_RESOLVED="${ARTIFACT_IMAGE_DIR:-$PUBLIC_DIR/image}"
          SNAPSHOT_DIR_RESOLVED="${ARTIFACT_SNAPSHOT_DIR:-$PUBLIC_DIR/snapshot}"

          test -f "$LATEST_PATH_RESOLVED"

          export LATEST_PATH_RESOLVED FEED_DIR_RESOLVED
          FEED_STEM="$(python - <<'PY'
          import json
          import os
          from pathlib import Path

          latest = Path(os.environ["LATEST_PATH_RESOLVED"])
          feed_dir = Path(os.environ["FEED_DIR_RESOLVED"])
          stem = ""

          if latest.exists():
              try:
                  obj = json.loads(latest.read_text(encoding='utf-8'))
                  stem = str(obj.get('feed_stem') or '').strip()
              except Exception:
                  pass

          if not stem and feed_dir.is_dir():
              candidates = sorted(
                  feed_dir.glob('*.json'),
                  key=lambda p: p.stat().st_mtime,
                  reverse=True,
              )
              if candidates:
                  stem = candidates[0].stem

          print(stem)
          PY
          )"

          if [ -z "$FEED_STEM" ]; then
            echo "Could not determine feed_stem from $LATEST_PATH_RESOLVED or $FEED_DIR_RESOLVED" >&2
            exit 1
          fi

          STAGE_DIR=/tmp/pages-state
          rm -rf "$STAGE_DIR"
          mkdir -p "$STAGE_DIR/feed" "$STAGE_DIR/snapshot" "$STAGE_DIR/image"
          cp "$LATEST_PATH_RESOLVED" "$STAGE_DIR/latest.json"
          cp "$FEED_DIR_RESOLVED/${FEED_STEM}.json" "$STAGE_DIR/feed/${FEED_STEM}.json"

          if [ -d "$SNAPSHOT_DIR_RESOLVED" ]; then
            cp -a "$SNAPSHOT_DIR_RESOLVED"/. "$STAGE_DIR/snapshot/"
          fi

          if [ -d "$IMAGE_DIR_RESOLVED" ]; then
            cp -a "$IMAGE_DIR_RESOLVED"/. "$STAGE_DIR/image/"
          fi

          tar -C "$STAGE_DIR" -czf /tmp/pages-state.tgz .

          echo 'changed=1' >> "$GITHUB_OUTPUT"
          echo "feed_stem=$FEED_STEM" >> "$GITHUB_OUTPUT"

      - name: Upload generated state artifact
        if: steps.publish.outputs.changed == '1'
        uses: actions/upload-artifact@v4
        with:
          name: pages-state-${{ github.run_id }}
          path: /tmp/pages-state.tgz
          if-no-files-found: error
          retention-days: 1

      - name: Stop stack
        if: always()
        run: docker compose -f docker-compose.yml down || true

      - name: Upload latest.json for x_post
        if: steps.publish.outputs.changed == '1'
        uses: actions/upload-artifact@v4
        with:
          name: latest-json-${{ github.run_id }}
          path: ${{ env.ARTIFACT_LATEST_PATH }}
          if-no-files-found: error
          retention-days: 1

  pages:
    needs: illustrate
    if: needs.illustrate.outputs.changed == '1'
    uses: ./.github/workflows/pages.yml
    secrets: inherit
    with:
      ref: main
      state_artifact_name: pages-state-${{ github.run_id }}
      artifact_run_id: ${{ github.run_id }}
    permissions:
      actions: read
      contents: read
      id-token: write

  x_post:
    needs: [illustrate, pages]
    if: needs.illustrate.outputs.changed == '1'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: post-x
      cancel-in-progress: false
    steps:
      - name: Checkout (main)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download generated state artifact
        uses: actions/download-artifact@v4
        with:
          name: pages-state-${{ github.run_id }}
          path: /tmp/pages-state

      - name: Restore generated state into public dir
        run: |
          set -euo pipefail
          mkdir -p frontend/app/public
          tar -C frontend/app/public -xzf /tmp/pages-state/pages-state.tgz

      - name: Download latest.json artifact
        uses: actions/download-artifact@v4
        with:
          name: latest-json-${{ github.run_id }}
          path: /tmp/latest-json

      - name: Place latest.json where post_to_x.py expects it
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "${ARTIFACT_LATEST_PATH}")"
          cp /tmp/latest-json/latest.json "${ARTIFACT_LATEST_PATH}"

      - name: Cache posted marker (per feed stem)
        id: cache
        uses: actions/cache@v4
        with:
          path: .x-posted
          key: x-posted-${{ needs.illustrate.outputs.feed_stem }}

      - name: Post latest to X
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          LATEST_PATH: ${{ env.ARTIFACT_LATEST_PATH }}
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
        run: |
          set -euo pipefail
          python scripts/post_to_x.py
          mkdir -p .x-posted
          echo '${{ needs.illustrate.outputs.feed_stem }}' > .x-posted/posted.txt

