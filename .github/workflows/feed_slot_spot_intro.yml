name: Feed Spot Intro

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  run:
    uses: ./.github/workflows/google_drive_post.yml
    with:
      kind: "event"
      avatar_image: "image/avatar/event.png"
      place: "Yokosuka"
      post_to_x: "1"
    secrets: inherit
