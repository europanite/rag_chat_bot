name: Feed Slot 05-07 Garbage Today (Day)

on:
  workflow_call:
    outputs:
      changed:
        description: "1 if feed files were updated"
        value: ${{ jobs.run.outputs.changed }}
      sha:
        description: "Commit SHA that contains the generated feed"
        value: ${{ jobs.run.outputs.sha }}
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  run:
    uses: ./.github/workflows/feed_core.yml
    with:
      scheduled_kind: "garbage_today"
      avatar_image: "avatar/day.png"
    secrets: inherit
