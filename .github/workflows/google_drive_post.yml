name: Google Drive Random Post

on:
  workflow_dispatch:
    inputs:
      folder_url_override:
        description: "Optional override for the public Google Drive folder URL"
        required: false
        default: ""
        type: string
      kind:
        description: "Feed kind"
        required: false
        default: "spot"
        type: choice
        options:
          - spot
          - restaurant
          - event
          - activity
          - garbage
      avatar_image:
        description: "Avatar image path under public/ (e.g. image/avatar/spot.png)"
        required: false
        default: "image/avatar/spot.png"
        type: string
      place:
        description: "Place label"
        required: false
        default: "Yokosuka"
        type: string
      recent_exclude_limit:
        description: "Avoid images used in the last N feed files when possible"
        required: false
        default: "20"
        type: string
      random_seed:
        description: "Optional deterministic seed for testing"
        required: false
        default: ""
        type: string
      post_to_x:
        description: "1 to post to X after publish"
        required: false
        default: "1"
        type: choice
        options:
          - "0"
          - "1"
  workflow_call:
    inputs:
      folder_url_override:
        required: false
        default: ""
        type: string
      kind:
        required: false
        default: "spot"
        type: string
      avatar_image:
        required: false
        default: "image/avatar/spot.png"
        type: string
      place:
        required: false
        default: "Yokosuka"
        type: string
      recent_exclude_limit:
        required: false
        default: "20"
        type: string
      random_seed:
        required: false
        default: ""
        type: string
      post_to_x:
        required: false
        default: "1"
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: google-drive-random-post
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      sha: ${{ steps.commit.outputs.sha }}
      feed_stem: ${{ steps.meta.outputs.feed_stem }}
    steps:
      - name: Checkout (main)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull latest main
        run: |
          set -euo pipefail
          git pull --ff-only origin main

      - name: Pick a random image+caption from public Google Drive folder and write feed files
        env:
          SECRET_FOLDER_URL: ${{ secrets.GOOGLE_DRIVE_PUBLIC_FOLDER_URL }}
          INPUT_FOLDER_URL_OVERRIDE: ${{ inputs.folder_url_override }}
          INPUT_KIND: ${{ inputs.kind }}
          INPUT_AVATAR_IMAGE: ${{ inputs.avatar_image }}
          INPUT_PLACE: ${{ inputs.place }}
          INPUT_RECENT_EXCLUDE_LIMIT: ${{ inputs.recent_exclude_limit }}
          INPUT_RANDOM_SEED: ${{ inputs.random_seed }}
        run: |
          set -euo pipefail
          FOLDER_URL="$SECRET_FOLDER_URL"
          if [ -n "$INPUT_FOLDER_URL_OVERRIDE" ]; then
            FOLDER_URL="$INPUT_FOLDER_URL_OVERRIDE"
          fi
          if [ -z "$FOLDER_URL" ]; then
            echo "ERROR: GOOGLE_DRIVE_PUBLIC_FOLDER_URL secret is empty and no folder_url_override was provided." >&2
            exit 1
          fi

          AVATAR_IMAGE="$INPUT_AVATAR_IMAGE"
          if [ -z "$AVATAR_IMAGE" ]; then
            case "$INPUT_KIND" in
              activity)
                AVATAR_IMAGE="image/avatar/activity.png"
                ;;
              event)
                AVATAR_IMAGE="image/avatar/event.png"
                ;;
              restaurant)
                AVATAR_IMAGE="image/avatar/food.png"
                ;;
              garbage)
                AVATAR_IMAGE="image/avatar/night.png"
                ;;
              spot|*)
                AVATAR_IMAGE="image/avatar/spot.png"
                ;;
            esac
          fi
          python scripts/prepare_drive_post.py \
            --folder-url "$FOLDER_URL" \
            --kind "$INPUT_KIND" \
            --avatar-image "$AVATAR_IMAGE" \
            --place "$INPUT_PLACE" \
            --recent-exclude-limit "$INPUT_RECENT_EXCLUDE_LIMIT" \
            --random-seed "$INPUT_RANDOM_SEED" \
            --public-dir 'frontend/app/public' \
            --latest-path 'frontend/app/public/latest.json' \
            --output-state /tmp/drive_post_state.json

      - name: Export prepare metadata
        id: meta
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          state = json.loads(Path('/tmp/drive_post_state.json').read_text(encoding='utf-8'))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f"feed_stem={state['feed_stem']}\n")
          PY

      - name: Commit & push if changed
        id: commit
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "No changes"
            echo "changed=0" >> "$GITHUB_OUTPUT"
            echo "sha=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add frontend/app/public/feed/*.json || true
          git add frontend/app/public/latest.json || true
          git add frontend/app/public/snapshot/*.json || true
          git add frontend/app/public/image/* || true

          if git diff --cached --quiet; then
            echo "No staged changes"
            echo "changed=0" >> "$GITHUB_OUTPUT"
            echo "sha=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "chore: add random Google Drive post"
          git push origin HEAD:main

          echo "changed=1" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  pages:
    needs: prepare
    if: needs.prepare.outputs.changed == '1'
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
    permissions:
      contents: read
      pages: write
      id-token: write

  x_post:
    needs: [prepare, pages]
    if: inputs.post_to_x == '1' && needs.prepare.outputs.changed == '1'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: post-x
      cancel-in-progress: false
    steps:
      - name: Checkout (generated commit)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache posted marker (per commit)
        id: cache
        uses: actions/cache@v4
        with:
          path: .x-posted
          key: x-posted-${{ needs.prepare.outputs.sha }}

      - name: Post latest to X
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          LATEST_PATH: frontend/app/public/latest.json
        run: |
          set -euo pipefail
          python scripts/post_to_x.py
          mkdir -p .x-posted
          echo '${{ needs.prepare.outputs.sha }}' > .x-posted/sha

      - name: Skip (already posted)
        if: steps.cache.outputs.cache-hit == 'true'
        run: echo "Already posted for this commit."
