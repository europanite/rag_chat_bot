name: Google Drive Random Post

on:
  workflow_dispatch:
    inputs:
      folder_url_override:
        description: "Optional override for the public Google Drive folder URL"
        required: false
        default: ""
        type: string
      kind:
        description: "Feed kind"
        required: false
        default: "spot"
        type: choice
        options:
          - spot
          - restaurant
          - event
          - activity
          - garbage
      avatar_image:
        description: "Avatar image path under public/ (e.g. image/avatar/spot.png)"
        required: false
        default: "image/avatar/spot.png"
        type: string
      place:
        description: "Place label"
        required: false
        default: "Yokosuka"
        type: string
      recent_exclude_limit:
        description: "Avoid images used in the last N feed files when possible"
        required: false
        default: "20"
        type: string
      random_seed:
        description: "Optional deterministic seed for testing"
        required: false
        default: ""
        type: string
      post_to_x:
        description: "1 to post to X after publish"
        required: false
        default: "1"
        type: choice
        options:
          - "0"
          - "1"
  workflow_call:
    inputs:
      folder_url_override:
        required: false
        default: ""
        type: string
      kind:
        required: false
        default: "spot"
        type: string
      avatar_image:
        required: false
        default: "image/avatar/spot.png"
        type: string
      place:
        required: false
        default: "Yokosuka"
        type: string
      recent_exclude_limit:
        required: false
        default: "20"
        type: string
      random_seed:
        required: false
        default: ""
        type: string
      post_to_x:
        required: false
        default: "1"
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

env:
  ASSET_MODE: local
  ARTIFACT_PUBLIC_DIR: frontend/app/public
  ARTIFACT_FEED_DIR: ""
  ARTIFACT_IMAGE_DIR: ""
  ARTIFACT_SNAPSHOT_DIR: ""
  ARTIFACT_LATEST_PATH: frontend/app/public/latest.json
  PUBLIC_FEED_URL: ./latest.json
  PUBLIC_ASSET_BASE_URL: ""
  PUBLIC_FEED_BASE_URL: ""
  PUBLIC_IMAGE_BASE_URL: ""
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_S3_BUCKET_PUBLIC: ${{ vars.AWS_S3_BUCKET_PUBLIC }}
  AWS_CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }}

concurrency:
  group: google-drive-random-post
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.publish.outputs.changed }}
      feed_stem: ${{ steps.meta.outputs.feed_stem }}
    steps:
      - name: Checkout (main)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull latest main
        run: |
          set -euo pipefail
          git pull --ff-only origin main

      - name: Pick a random image+caption from public Google Drive folder and write feed files
        env:
          SECRET_FOLDER_URL: ${{ secrets.GOOGLE_DRIVE_PUBLIC_FOLDER_URL }}
          INPUT_FOLDER_URL_OVERRIDE: ${{ inputs.folder_url_override }}
          INPUT_KIND: ${{ inputs.kind }}
          INPUT_AVATAR_IMAGE: ${{ inputs.avatar_image }}
          INPUT_PLACE: ${{ inputs.place }}
          INPUT_RECENT_EXCLUDE_LIMIT: ${{ inputs.recent_exclude_limit }}
          INPUT_RANDOM_SEED: ${{ inputs.random_seed }}
        run: |
          set -euo pipefail
          FOLDER_URL="$SECRET_FOLDER_URL"
          if [ -n "$INPUT_FOLDER_URL_OVERRIDE" ]; then
            FOLDER_URL="$INPUT_FOLDER_URL_OVERRIDE"
          fi
          if [ -z "$FOLDER_URL" ]; then
            echo "ERROR: GOOGLE_DRIVE_PUBLIC_FOLDER_URL secret is empty and no folder_url_override was provided." >&2
            exit 1
          fi

          AVATAR_IMAGE="$INPUT_AVATAR_IMAGE"
          if [ -z "$AVATAR_IMAGE" ]; then
            case "$INPUT_KIND" in
              activity)
                AVATAR_IMAGE="image/avatar/activity.png"
                ;;
              event)
                AVATAR_IMAGE="image/avatar/event.png"
                ;;
              restaurant)
                AVATAR_IMAGE="image/avatar/food.png"
                ;;
              garbage)
                AVATAR_IMAGE="image/avatar/night.png"
                ;;
              spot|*)
                AVATAR_IMAGE="image/avatar/spot.png"
                ;;
            esac
          fi
          python scripts/prepare_drive_post.py \
            --folder-url "$FOLDER_URL" \
            --kind "$INPUT_KIND" \
            --avatar-image "$AVATAR_IMAGE" \
            --place "$INPUT_PLACE" \
            --recent-exclude-limit "$INPUT_RECENT_EXCLUDE_LIMIT" \
            --random-seed "$INPUT_RANDOM_SEED" \
            --public-dir "${ARTIFACT_PUBLIC_DIR:-frontend/app/public}" \
            --latest-path "${ARTIFACT_LATEST_PATH:-frontend/app/public/latest.json}" \
            --output-state /tmp/drive_post_state.json

      - name: Export prepare metadata
        id: meta
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          state = json.loads(Path('/tmp/drive_post_state.json').read_text(encoding='utf-8'))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f"feed_stem={state['feed_stem']}\n")
          PY

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          disable-retry: true

      - name: Publish generated artifacts to S3
        id: publish
        env:
          FEED_STEM: ${{ steps.meta.outputs.feed_stem }}
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "No changes"
            echo "changed=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PUBLIC_DIR="${ARTIFACT_PUBLIC_DIR:-frontend/app/public}"
          LATEST_PATH_RESOLVED="${ARTIFACT_LATEST_PATH:-$PUBLIC_DIR/latest.json}"
          FEED_DIR_RESOLVED="${ARTIFACT_FEED_DIR:-$PUBLIC_DIR/feed}"
          SNAPSHOT_DIR_RESOLVED="${ARTIFACT_SNAPSHOT_DIR:-$(dirname "$LATEST_PATH_RESOLVED")/snapshot}"
          IMAGE_DIR_RESOLVED="${ARTIFACT_IMAGE_DIR:-$PUBLIC_DIR/image}"
          FEED_JSON_PATH="$FEED_DIR_RESOLVED/$FEED_STEM.json"

          test -n "$AWS_S3_BUCKET_PUBLIC"
          test -f "$LATEST_PATH_RESOLVED"
          test -f "$FEED_JSON_PATH"

          aws s3 cp "$LATEST_PATH_RESOLVED" "s3://$AWS_S3_BUCKET_PUBLIC/latest.json"
          aws s3 cp "$FEED_JSON_PATH" "s3://$AWS_S3_BUCKET_PUBLIC/feed/$FEED_STEM.json"

          if [ -d "$SNAPSHOT_DIR_RESOLVED" ]; then
            aws s3 sync "$SNAPSHOT_DIR_RESOLVED" "s3://$AWS_S3_BUCKET_PUBLIC/snapshot/"
          fi

          if [ -d "$IMAGE_DIR_RESOLVED" ]; then
            aws s3 sync "$IMAGE_DIR_RESOLVED" "s3://$AWS_S3_BUCKET_PUBLIC/image/"
          fi

          if [ -n "${AWS_CLOUDFRONT_DISTRIBUTION_ID:-}" ]; then
            aws cloudfront create-invalidation \
              --distribution-id "$AWS_CLOUDFRONT_DISTRIBUTION_ID" \
              --paths "/latest.json" "/feed/$FEED_STEM.json" "/image/*" "/snapshot/*"
          fi

          echo "changed=1" >> "$GITHUB_OUTPUT"

      - name: Upload latest.json for x_post
        if: steps.publish.outputs.changed == '1'
        uses: actions/upload-artifact@v4
        with:
          name: latest-json-${{ github.run_id }}
          path: ${{ env.ARTIFACT_LATEST_PATH }}
          if-no-files-found: error
          retention-days: 1

  x_post:
    needs: prepare
    if: inputs.post_to_x == '1' && needs.prepare.outputs.changed == '1'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: post-x
      cancel-in-progress: false
    steps:
      - name: Checkout (main)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download latest.json artifact
        uses: actions/download-artifact@v4
        with:
          name: latest-json-${{ github.run_id }}
          path: /tmp/latest-json

      - name: Place latest.json where post_to_x.py expects it
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "${ARTIFACT_LATEST_PATH}")"
          cp /tmp/latest-json/latest.json "${ARTIFACT_LATEST_PATH}"

      - name: Cache posted marker (per feed stem)
        id: cache
        uses: actions/cache@v4
        with:
          path: .x-posted
          key: x-posted-${{ needs.prepare.outputs.feed_stem }}

      - name: Post latest to X
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          LATEST_PATH: ${{ env.ARTIFACT_LATEST_PATH }}
        run: |
          set -euo pipefail
          python scripts/post_to_x.py
          mkdir -p .x-posted
          echo '${{ needs.prepare.outputs.feed_stem }}' > .x-posted/feed_stem

      - name: Skip (already posted)
        if: steps.cache.outputs.cache-hit == 'true'
        run: echo "Already posted for this feed stem."
