name: Pages

on:
  workflow_call:
    inputs:
      ref:
        description: "Branch/ref to build & deploy"
        required: false
        type: string
        default: "main"
      state_artifact_name:
        description: "Optional artifact name containing latest/feed/image/snapshot to overlay before export"
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/ref to build & deploy"
        required: false
        default: "main"
      state_artifact_name:
        description: "Optional artifact name containing latest/feed/image/snapshot to overlay before export"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

env:
  ASSET_MODE: local
  ARTIFACT_PUBLIC_DIR: frontend/app/public
  ARTIFACT_FEED_DIR: ""
  ARTIFACT_IMAGE_DIR: ""
  ARTIFACT_SNAPSHOT_DIR: ""
  ARTIFACT_LATEST_PATH: frontend/app/public/latest.json
  PUBLIC_FEED_URL: ./latest.json
  PUBLIC_ASSET_BASE_URL: ""
  PUBLIC_FEED_BASE_URL: ""
  PUBLIC_IMAGE_BASE_URL: ""

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (ref)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Ensure latest remote ref (branch only)
        run: |
          set -euo pipefail
          REF="${{ inputs.ref }}"

          # If it's a commit SHA, checkout is already pinned to it.
          if [[ "$REF" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "inputs.ref looks like a commit SHA ($REF); skipping remote reset."
            exit 0
          fi

          git fetch origin "$REF" --prune
          if git show-ref --verify --quiet "refs/remotes/origin/$REF"; then
            git reset --hard "origin/$REF"
          fi

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/app/package-lock.json

      - name: Install deps
        working-directory: frontend/app
        run: npm ci

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download generated state artifact (optional)
        if: inputs.state_artifact_name != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.state_artifact_name }}
          path: /tmp/pages-state

      - name: Restore generated state artifact into public dir (optional)
        if: inputs.state_artifact_name != ''
        run: |
          set -euo pipefail
          mkdir -p frontend/app/public
          tar -C frontend/app/public -xzf /tmp/pages-state/pages-state.tgz

      - name: Build paged feed
        env:
          FEED_PATH: ${{ env.ARTIFACT_PUBLIC_DIR }}
          LATEST_PATH: ${{ env.ARTIFACT_LATEST_PATH }}
          FEED_PAGE_SIZE: "20"
        run: |
          python scripts/build_feed_pages.py

      - name: Build
        working-directory: frontend/app
        env:
          EXPO_PUBLIC_FEED_URL: ${{ vars.EXPO_PUBLIC_FEED_URL }}
          EXPO_PUBLIC_ASSET_BASE_URL: ${{ vars.EXPO_PUBLIC_ASSET_BASE_URL }}
          EXPO_PUBLIC_FEED_BASE_URL: ${{ vars.EXPO_PUBLIC_FEED_BASE_URL }}
          EXPO_PUBLIC_IMAGE_BASE_URL: ${{ vars.EXPO_PUBLIC_IMAGE_BASE_URL }}
          EXPO_PUBLIC_FEEDBACK_FORM_URL: ${{ vars.EXPO_PUBLIC_FEEDBACK_FORM_URL }}
          EXPO_PUBLIC_USE_SLOT: 1
          EXPO_PUBLIC_SLOT_ROTATE_MS: 6500
          EXPO_PUBLIC_SLOT_FADE_MS: 800
        run: |
          npx expo export --platform web --output-dir web-build

      - name: Copy local public assets into exported site
        working-directory: frontend/app
        run: |
          set -euo pipefail
          cp -av public/. web-build/

      - name: Compute site base path (GitHub Pages)
        run: |
          set -euo pipefail
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          SITE_URL="https://${OWNER}.github.io"
          BASE_PATH="$REPO"
          if [ "$REPO" = "${OWNER}.github.io" ]; then
            BASE_PATH=""
          fi
          echo "SITE_URL=$SITE_URL" >> "$GITHUB_ENV"
          echo "BASE_PATH=$BASE_PATH" >> "$GITHUB_ENV"

      - name: Build social share pages (OG tags)
        env:
          PUBLIC_DIR: frontend/app/web-build
        run: |
          set -euo pipefail
          python scripts/build_social_pages.py
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/app/web-build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
