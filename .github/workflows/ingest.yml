name: Ingest

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          set -eux
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          docker system prune -af || true
          df -h

      - name: Ensure pipeline scripts are executable
        run: |
          set -eux
          chmod +x scripts/ingest.sh scripts/rag_snapshot_s3.py scripts/verify_ingest_state.py

      - name: Validate AWS snapshot settings
        env:
          AWS_ROLE_ARN_SECRET: ${{ secrets.AWS_ROLE_ARN }}
          AWS_REGION_VALUE: ${{ vars.AWS_REGION }}
          AWS_S3_BUCKET_BACKUP_VALUE: ${{ vars.AWS_S3_BUCKET_BACKUP }}
        run: |
          set -euo pipefail
          [ -n "${AWS_REGION_VALUE:-}" ] || { echo "ERROR: vars.AWS_REGION is required."; exit 1; }
          [ -n "${AWS_ROLE_ARN_SECRET:-}" ] || { echo "ERROR: secrets.AWS_ROLE_ARN is required."; exit 1; }
          [ -n "${AWS_S3_BUCKET_BACKUP_VALUE:-}" ] || { echo "ERROR: vars.AWS_S3_BUCKET_BACKUP is required."; exit 1; }

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Debug docs directory before ingest
        run: |
          set -euo pipefail
          mkdir -p tmp/ingest-debug
          python3 scripts/verify_ingest_state.py docs \
            --docs-dir data/json \
            --sample-limit 10 | tee tmp/ingest-debug/docs-before-ingest.json

      - name: Ingest (via shared pipeline script)
        env:
          RAG_AUTO_INDEX: "false"
          RAG_REBUILD_ON_START: "false"
          RAG_REINDEX_ENABLED: "true"
          OLLAMA_TIMEOUT_S: "512"
          OLLAMA_BASE_URL: "http://ollama:11434"
          RAG_MODEL: "llama3.1:8b"
          AUDIT_MODEL: "llama3.1:8b"
          EMBEDDING_MODEL: "mxbai-embed-large"
          REACT_NATIVE_PACKAGER_HOSTNAME: "127.0.0.1"
          RAG_AUDIT: "0"
          RAG_AUDIT_REWRITE: "0"
          RAG_AUDIT_MAX_ATTEMPTS: "2"
        run: |
          set -euo pipefail
          bash scripts/ingest.sh ingest --ci

      - name: Show reindex response captured by ingest.sh
        if: always()
        run: |
          set -euo pipefail
          mkdir -p tmp/ingest-debug
          {
            echo "=== /tmp/reindex_headers.txt ==="
            if [ -f /tmp/reindex_headers.txt ]; then
              sed -n '1,200p' /tmp/reindex_headers.txt
            else
              echo "(missing)"
            fi
            echo
            echo "=== /tmp/reindex_body.json ==="
            if [ -f /tmp/reindex_body.json ]; then
              sed -n '1,200p' /tmp/reindex_body.json
              cp /tmp/reindex_body.json tmp/ingest-debug/reindex-body.json
            else
              echo "(missing)"
            fi
          } | tee tmp/ingest-debug/reindex-response.txt

      - name: Verify chroma_db written
        run: |
          set -euo pipefail
          echo "chroma_db file count:"
          find chroma_db -type f | wc -l
          echo "chroma_db size:"
          du -sh chroma_db || true
          echo "sample files:"
          find chroma_db -type f | sed -n '1,30p'
          n=$(find chroma_db -type f | wc -l)
          if [ "$n" -lt 5 ]; then
            echo "ERROR: chroma_db seems empty after reindex. Volume mapping is likely wrong."
            exit 1
          fi

      - name: Debug chroma sqlite state before strict verify
        if: always()
        run: |
          set -euo pipefail
          mkdir -p tmp/ingest-debug
          python3 scripts/verify_ingest_state.py chroma \
            --chroma-dir chroma_db \
            --collection-name documents | tee tmp/ingest-debug/chroma-after-ingest.json

      - name: Verify live embeddings inside chroma_db
        run: |
          set -euo pipefail
          python3 scripts/rag_snapshot_s3.py verify-local             --chroma-dir chroma_db             --collection-name documents             --min-count 1

      - name: Upload ingest debug artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingest-debug-${{ github.run_id }}
          path: tmp/ingest-debug
          if-no-files-found: warn
          retention-days: 7

      - name: Package chroma_db artifact
        run: |
          set -euo pipefail
          tar -C . -czf /tmp/chroma-db.tgz chroma_db

      - name: Upload chroma_db artifact
        uses: actions/upload-artifact@v4
        with:
          name: chroma-db
          path: /tmp/chroma-db.tgz
          if-no-files-found: error
          retention-days: 7

      - name: Upload verified RAG snapshot to S3
        env:
          AWS_S3_BUCKET_BACKUP: ${{ vars.AWS_S3_BUCKET_BACKUP }}
        run: |
          set -euo pipefail
          python3 scripts/rag_snapshot_s3.py upload-latest             --bucket "${AWS_S3_BUCKET_BACKUP}"             --prefix "rag/chroma"             --chroma-dir chroma_db

      - name: Commit & push chroma_db (disabled; S3 snapshot is the source of truth)
        if: ${{ false }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git pull --ff-only origin main

          git add -A chroma_db
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update chroma_db index"
          git push
