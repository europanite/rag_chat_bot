name: Ingest

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          set -eux
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          docker system prune -af || true
          df -h

      - name: Ensure pipeline script is executable
        run: |
          set -eux
          chmod +x scripts/ingest.sh

      - name: Ingest (via shared pipeline script)
        env:
          RAG_AUTO_INDEX: "false"
          RAG_REBUILD_ON_START: "false"
          RAG_REINDEX_ENABLED: "true"
          OLLAMA_TIMEOUT_S: "512"
          OLLAMA_BASE_URL: "http://ollama:11434"
          RAG_MODEL: "llama3.1:8b"
          AUDIT_MODEL: "llama3.1:8b"
          EMBEDDING_MODEL: "mxbai-embed-large"
          REACT_NATIVE_PACKAGER_HOSTNAME: "127.0.0.1"
        run: |
          set -euo pipefail
          bash scripts/ingest.sh ingest --ci

      - name: Verify chroma_db written
        run: |
          set -euo pipefail
          echo "chroma_db file count:"
          find chroma_db -type f | wc -l
          echo "chroma_db size:"
          du -sh chroma_db || true
          echo "sample files:"
          find chroma_db -maxdepth 2 -type f | head -n 30
          n=$(find chroma_db -type f | wc -l)
          if [ "$n" -lt 5 ]; then
            echo "ERROR: chroma_db seems empty after reindex. Volume mapping is likely wrong."
            exit 1
          fi

      - name: Commit & push chroma_db
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git pull --ff-only origin main

          git add -A chroma_db
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update chroma_db index"
          git push
